<svg width="360" height="320" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term { font-family: 'Courier New', monospace; fill: #00c9ff; white-space: pre; }
      .dim { fill: #2c5364; }
      .bright { fill: #7fffd4; }
    </style>
  </defs>

  <rect width="360" height="320" rx="10" fill="#0a0e14" stroke="#00c9ff" stroke-opacity="0.4"/>

  <!-- terminal title bar -->
  <rect width="360" height="26" rx="10" fill="#111826"/>
  <circle cx="18" cy="13" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="13" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="13" r="5" fill="#27c93f"/>
  <text x="180" y="17" text-anchor="middle" class="term dim" font-size="11">sayantan.ascii</text>

  <!-- ascii portrait: hair / sunglasses / beard / crossed arms -->
  <text x="34" y="60" class="term" font-size="12.5">
    <tspan x="34" dy="0">        ▄▄▄▄▄▄▄▄▄▄▄</tspan>
    <tspan x="34" dy="16">      ▄█████████████▄</tspan>
    <tspan x="34" dy="16" class="bright">     █▓▓●●▓▓▓▓●●▓▓█   </tspan>
    <tspan x="34" dy="16">     █░░░░░▀▀▀░░░░░█</tspan>
    <tspan x="34" dy="16">      █▓▓▓▓▓▓▓▓▓▓▓█</tspan>
    <tspan x="34" dy="16">       ▀▀███████▀▀</tspan>
    <tspan x="34" dy="18">     ╔═══════════════╗</tspan>
    <tspan x="34" dy="16">    ═╣  \\  ___  //  ╠═</tspan>
    <tspan x="34" dy="16">    ═╣   \\/   \\/   ╠═</tspan>
    <tspan x="34" dy="16">     ╚═══════════════╝</tspan>
  </text>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="360" height="4" fill="#00c9ff" opacity="0.15">
    <animate attributeName="y" values="26;300;26" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- glasses glint -->
  <rect x="70" y="83" width="10" height="4" fill="#7fffd4">
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="190" y="83" width="10" height="4" fill="#7fffd4">
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- typed line -->
  <text x="30" y="248" class="term bright" font-size="13">&gt; whoami</text>
  <text x="30" y="267" class="term" font-size="13">SAYANTAN_CHAKRABORTY</text>
  <text x="30" y="286" class="term dim" font-size="12">role: full stack developer</text>
  <text x="30" y="303" class="term dim" font-size="12">stack: MERN + TypeScript</text>

  <!-- blinking cursor -->
  <rect x="205" y="275" width="8" height="14" fill="#00c9ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
